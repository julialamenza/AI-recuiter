services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruiting
    ports:
      - "5432:5432"
    volumes:
      - recruiting_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruiting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recruiting_pg:
